<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">Local Usage Dashboard</title>
  <desc id="description">An original local analytics mark with three usage bars and a rising activity line.</desc>
  <defs>
    <linearGradient id="panel" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1b211c"/>
      <stop offset="1" stop-color="#0e110f"/>
    </linearGradient>
    <linearGradient id="signal" x1="12" y1="40" x2="52" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78984b"/>
      <stop offset="1" stop-color="#c9f46d"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#panel)" stroke="#343c36" stroke-width="2"/>
  <path d="M12 48.5H52" stroke="#4a544c" stroke-width="2" stroke-linecap="round"/>
  <rect x="14" y="35" width="8" height="13" rx="2" fill="#c9f46d"/>
  <rect x="28" y="27" width="8" height="21" rx="2" fill="#78984b"/>
  <rect x="42" y="20" width="8" height="28" rx="2" fill="#f0a05e"/>
  <path d="M13 31L25 25L33 29L49 14" fill="none" stroke="url(#signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="49" cy="14" r="4" fill="#c9f46d" stroke="#121513" stroke-width="2"/>
</svg>
