name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source and tests
        run: npm run check
      - name: Install Sites dependencies
        run: npm ci --prefix sites-hub
      - name: Validate Sites build and tests
        run: npm test --prefix sites-hub
      - name: Lint Sites
        run: npm run lint --prefix sites-hub
      - name: Audit deployed Sites dependencies
        run: npm audit --omit=dev --audit-level=high --prefix sites-hub
      - name: Build container
        run: docker build --tag codex-usage-dashboard:ci .
