name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate Windows diagnostics and supervision
        run: node --test --test-concurrency=1 test/windows-agent-diagnostic.test.mjs test/windows-agent-supervision.test.mjs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate source and tests
        run: npm run check
      - name: Install Mesh ingress dependencies
        run: npm ci --prefix mesh-ingress
      - name: Validate Mesh ingress
        run: npm run check --prefix mesh-ingress
      - name: Audit all Mesh ingress dependencies
        run: npm audit --audit-level=low --prefix mesh-ingress
      - name: Install Sites dependencies
        run: npm ci --prefix sites-hub
      - name: Validate Sites build and tests
        run: npm test --prefix sites-hub
      - name: Lint Sites
        run: npm run lint --prefix sites-hub
      - name: Audit all Sites dependencies
        run: npm audit --audit-level=low --prefix sites-hub
      - name: Build container
        run: docker build --tag codex-usage-dashboard:ci .
